{% extends 'base.html' %}

{% block content %}
<div class="auth-wrapper">
    <div class="glass-card">
        <h2 style="text-align: center; font-size: 2rem;">Create Account</h2>
        <p style="text-align: center; color: var(--text-light); margin-bottom: 2rem;">Join Bloom Jobs today</p>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn" style="width: 100%; margin-top: 1rem; font-size: 1.1rem;">Sign Up</button>
        </form>
        <div class="auth-links">
            <p>Already have an account? <a href="{% url 'login' %}">Log in here</a></p>
        </div>
    </div>
</div>
{% endblock %}
